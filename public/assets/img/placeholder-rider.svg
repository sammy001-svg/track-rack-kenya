<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Rider apparel and gear">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241E18"/><stop offset="55%" stop-color="#17130F"/><stop offset="100%" stop-color="#0E0B09"/>
    </linearGradient>
    <radialGradient id="rgl" cx="30%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#B99149" stop-opacity=".28"/><stop offset="100%" stop-color="#B99149" stop-opacity="0"/>
    </radialGradient>
    <filter id="rgr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#rg)"/>
  <rect width="800" height="1000" fill="url(#rgl)"/>

  <g stroke="#B99149" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".78">
    <!-- helmet -->
    <path d="M250 300a150 150 0 0 1 300 0v34H250z"/>
    <path d="M250 334h330l-46 40H250z"/>
    <path d="M300 258q100-40 200 0"/>
    <!-- paddock boot -->
    <path d="M330 520v210q0 26 26 26h150q26 0 26-26v-14q0-18-20-26l-70-28q-22-9-22-32V520z"/>
    <path d="M330 756h202" stroke-width="9"/>
    <g stroke-width="2.4">
      <path d="M348 560h68M348 596h68M348 632h68M348 668h68"/>
    </g>
    <!-- glove -->
    <path d="M188 812q-24 0-24 22v78q0 24 24 24h120q24 0 24-24v-96q0-18-18-18t-18 18v34"/>
    <path d="M226 812v-52q0-16 16-16t16 16v52M266 812v-64q0-16 16-16t16 16v64"/>
  </g>

  <g stroke="#EBD9BC" stroke-width="2.2" stroke-dasharray="9 11" opacity=".3">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="900" x2="740" y2="900"/>
  </g>

  <text x="400" y="962" text-anchor="middle" font-family="Georgia,serif" font-size="30" letter-spacing="10" fill="#B99149" opacity=".6">RIDER</text>
  <rect width="800" height="1000" filter="url(#rgr)" opacity=".55"/>
</svg>
