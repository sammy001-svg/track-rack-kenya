<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Stable, grooming and leather care">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232019"/><stop offset="55%" stop-color="#16130F"/><stop offset="100%" stop-color="#0C0A08"/>
    </linearGradient>
    <radialGradient id="sgl" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#B99149" stop-opacity=".26"/><stop offset="100%" stop-color="#B99149" stop-opacity="0"/>
    </radialGradient>
    <filter id="sgr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="19"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#sg)"/>
  <rect width="800" height="1000" fill="url(#sgl)"/>

  <g stroke="#B99149" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <!-- body brush -->
    <path d="M220 300q0-40 40-40h280q40 0 40 40v54q0 26-26 26H246q-26 0-26-26z"/>
    <path d="M256 260q0-30 30-30h228q30 0 30 30"/>
    <g stroke-width="2.4" opacity=".85">
      <path d="M250 380v58M282 380v66M314 380v58M346 380v66M378 380v58M410 380v66M442 380v58M474 380v66M506 380v58M538 380v66"/>
    </g>
    <!-- balm tin -->
    <ellipse cx="290" cy="612" rx="94" ry="30"/>
    <path d="M196 612v76q0 30 94 30t94-30v-76"/>
    <ellipse cx="290" cy="612" rx="58" ry="18" stroke-width="2.2"/>
    <!-- bucket -->
    <path d="M452 596h172l-24 168q-4 28-32 28h-60q-28 0-32-28z"/>
    <ellipse cx="538" cy="596" rx="86" ry="24"/>
    <path d="M466 566q72-56 144 0" stroke-width="4"/>
    <!-- hoof pick -->
    <path d="M232 848h188" stroke-width="7"/>
    <path d="M420 848q40 0 40 34t-34 34"/>
  </g>

  <g stroke="#EBD9BC" stroke-width="2.2" stroke-dasharray="9 11" opacity=".3">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="920" x2="740" y2="920"/>
  </g>

  <text x="400" y="972" text-anchor="middle" font-family="Georgia,serif" font-size="30" letter-spacing="10" fill="#B99149" opacity=".6">STABLE</text>
  <rect width="800" height="1000" filter="url(#sgr)" opacity=".55"/>
</svg>
