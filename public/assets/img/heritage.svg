<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Tack Rack workshop bench with hand tools, waxed thread and cut leather">
  <defs>
    <linearGradient id="wb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1B1611"/>
      <stop offset="46%" stop-color="#2E2419"/>
      <stop offset="60%" stop-color="#6B4522"/>
      <stop offset="100%" stop-color="#2A1B0E"/>
    </linearGradient>
    <radialGradient id="lamp" cx="30%" cy="8%" r="58%">
      <stop offset="0%"   stop-color="#F0D9A8" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#F0D9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="br2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBD3A0"/><stop offset="55%" stop-color="#B99149"/><stop offset="100%" stop-color="#7C5F20"/>
    </linearGradient>
    <filter id="wgr"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="23"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wb)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>

  <!-- bench top -->
  <rect y="520" width="1600" height="380" fill="#5C3A1A" opacity=".85"/>
  <g stroke="#3A2410" stroke-width="2" opacity=".5">
    <line x1="0" y1="566" x2="1600" y2="566"/><line x1="0" y1="634" x2="1600" y2="634"/>
    <line x1="0" y1="712" x2="1600" y2="712"/><line x1="0" y1="800" x2="1600" y2="800"/>
  </g>
  <rect y="512" width="1600" height="12" fill="#8A5A2B" opacity=".6"/>

  <!-- cut hide -->
  <path d="M120 560 L560 548 L590 700 L96 716 Z" fill="#7A4E24" opacity=".9"/>
  <path d="M120 560 L560 548" stroke="#A5713C" stroke-width="5" opacity=".6"/>
  <g stroke="#EBD9BC" stroke-width="4" stroke-dasharray="16 14" opacity=".65">
    <line x1="140" y1="600" x2="572" y2="588"/>
    <line x1="146" y1="668" x2="580" y2="656"/>
  </g>

  <!-- half-made bridle hanging -->
  <g stroke="#8A5A2B" stroke-width="18" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M980 60 q60 190 8 360"/>
    <path d="M1120 60 q-60 190 -8 360"/>
    <path d="M988 250 q56 40 112 0"/>
  </g>
  <g stroke="#EBD9BC" stroke-width="2.6" stroke-dasharray="8 10" opacity=".5" fill="none">
    <path d="M980 60 q60 190 8 360"/>
    <path d="M1120 60 q-60 190 -8 360"/>
  </g>
  <circle cx="1052" cy="440" r="34" fill="none" stroke="url(#br2)" stroke-width="11"/>

  <!-- awl + creaser laid on the bench -->
  <g stroke="url(#br2)" stroke-width="9" stroke-linecap="round">
    <line x1="720" y1="660" x2="900" y2="628"/>
    <line x1="740" y1="742" x2="930" y2="726"/>
  </g>
  <g fill="#2A1A0C" opacity=".85">
    <rect x="688" y="646" width="52" height="26" rx="10" transform="rotate(-10 714 659)"/>
    <rect x="708" y="730" width="52" height="26" rx="10" transform="rotate(-5 734 743)"/>
  </g>

  <!-- waxed thread spool -->
  <g transform="translate(1330 690)">
    <ellipse cx="0" cy="0" rx="86" ry="30" fill="#4A3018"/>
    <path d="M-86 0v-96q0-30 86-30t86 30V0" fill="#EBD9BC" opacity=".82"/>
    <ellipse cx="0" cy="-96" rx="86" ry="30" fill="#F4EADA" opacity=".9"/>
    <g stroke="#C9BBA1" stroke-width="2" opacity=".6">
      <path d="M-70 -20h140M-74 -46h148M-70 -72h140"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="#14110E" opacity=".3"/>
  <rect width="1600" height="900" filter="url(#wgr)" opacity=".55"/>
</svg>
